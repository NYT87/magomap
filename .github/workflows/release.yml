name: Release

# Release Please keeps a release PR open on main. Merging it creates the release
# (tag magomap-vX.Y.Z), and only then is that release deployed to Cloudflare.
# A manual run (workflow_dispatch) redeploys an existing release tag, for retrying a failed deploy.
#
# Jobs, each with only the access it needs:
#   release-please     creates the releases (not the PR)         contents + pull-requests write
#   release-pr          creates/updates the release PR, last      contents + pull-requests write
#   verify-release-pr  starts CI on the release PR               actions write
#   resolve            checks which release to deploy            contents read
#   build              runs the checks and builds the web app    contents read, no secrets
#   deploy             D1 bookmark, migrations, deploy, health   production environment
#   extension-bundle   builds the extension zip for its release  contents read, no secrets
#   extension-upload   attaches the zip to the extension release contents write
# The tests and the web build never run in the job that holds the Cloudflare token; that job
# runs only Wrangler (and its dependencies) on the guarded release commit.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. magomap-v0.2.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # A root (".") component's outputs are top-level:
    # https://github.com/googleapis/release-please-action/blob/45996ed1f6d02564a971a2fa1b5860e934307cf7/README.md#root-component-outputs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      # The extension component's outputs are prefixed with its path:
      # https://github.com/googleapis/release-please-action/blob/45996ed1f6d02564a971a2fa1b5860e934307cf7/README.md#outputs
      extension_release_created: ${{ steps.release.outputs['apps/extension--release_created'] }}
      extension_tag_name: ${{ steps.release.outputs['apps/extension--tag_name'] }}
      extension_sha: ${{ steps.release.outputs['apps/extension--sha'] }}
    steps:
      # Pinned to the commit SHA of releases at least 14 days old.
      - name: Create or update the release PR and the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The release PR is made by the `release-pr` job below, after the extension release is
          # published: a draft release has no git tag yet, so a PR made in this step would not
          # see it and would list the same changes again under a new version.
          skip-github-pull-request: true

  # Creates or updates the next release PR once the releases above exist as tags. It waits for
  # the extension upload job (which publishes the draft extension release, creating its tag), so
  # Release Please sees the version that was just released. Skipped, not failed, when no
  # extension release was made. If that upload failed, no PR is made until the next push to main.
  release-pr:
    needs: [release-please, extension-upload]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
        needs.release-please.result == 'success' &&
        (needs.extension-upload.result == 'success' || needs.extension-upload.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned to the commit SHA of releases at least 14 days old.
      - name: Create or update the release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # PRs opened with GITHUB_TOKEN don't trigger workflows, so CI is dispatched on the release PR's
  # branch. A job of its own, so the third-party Release Please action never holds `actions: write`.
  # Skipped when a release was just created, so it can never hold back that release's deploy.
  verify-release-pr:
    needs: [release-please, release-pr]
    if: ${{ !cancelled() && needs.release-pr.result == 'success' && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch CI for the open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release Please's branch for this repo's single component "magomap" on main.
          branch_pattern='^release-please--branches--main(--components--magomap)?$'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          release_branch="$(curl --fail --silent --show-error "${headers[@]}" "$api/pulls?state=open&base=main&per_page=100" |
            jq -r --arg pattern "$branch_pattern" --arg repo "$GITHUB_REPOSITORY" \
              '[.[] | select(.head.repo.full_name == $repo and (.head.ref | test($pattern)))][0].head.ref // empty')"
          if [ -z "$release_branch" ]; then
            echo 'No open Release Please PR to verify.'
            exit 0
          fi

          jq -n --arg ref "$release_branch" '{ref: $ref}' |
            curl --fail --silent --show-error "${headers[@]}" \
              --request POST \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$api/actions/workflows/ci.yml/dispatches"
          echo "Dispatched CI on $release_branch."

  resolve:
    needs: release-please
    # On push: only when Release Please has just created a magomap release (tag magomap-v…), so
    # a release of any other component added later (e.g. an extension) is skipped, not failed.
    # On a manual run: always, and this job refuses anything that isn't a released magomap tag.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true' &&
          startsWith(needs.release-please.outputs.tag_name, 'magomap-v')) ||
        github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      sha7: ${{ steps.release.outputs.sha7 }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and guard the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ needs.release-please.outputs.tag_name }}
          PUSH_SHA: ${{ needs.release-please.outputs.sha }}
          PUSH_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          tag_pattern='^magomap-v[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || fail "Run this workflow from main, not $GITHUB_REF."
            tag="$INPUT_TAG"
            [[ "$tag" =~ $tag_pattern ]] || fail "The tag must look like magomap-vX.Y.Z."
            # The release must exist, be published, and have been created by Release Please.
            release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,author)" ||
              fail "There is no release for $tag."
            [ "$(jq -r '.tagName' <<< "$release")" = "$tag" ] || fail "The release is not tagged $tag."
            [ "$(jq -r '.isDraft' <<< "$release")" = false ] || fail "The release for $tag is a draft."
            [ "$(jq -r '.author.login' <<< "$release")" = 'github-actions[bot]' ] ||
              fail "The release for $tag was not created by Release Please."
            # The SHA is the commit the tag points to (peeling an annotated tag).
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")" || fail "The tag $tag does not exist."
            type="$(jq -r '.object.type' <<< "$ref")"
            sha="$(jq -r '.object.sha' <<< "$ref")"
            if [ "$type" = tag ]; then
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object')"
              type="$(jq -r '.type' <<< "$object")"
              sha="$(jq -r '.sha' <<< "$object")"
            fi
            [ "$type" = commit ] || fail "The tag $tag does not point to a commit."
            version="${tag#magomap-v}"
          else
            tag="$PUSH_TAG"
            sha="$PUSH_SHA"
            version="$PUSH_VERSION"
            [[ "$tag" =~ $tag_pattern ]] || fail "Release Please created an unexpected tag: $tag."
            [ "$tag" = "magomap-v$version" ] || fail "The tag $tag does not match version $version."
          fi

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "The release commit is not a full SHA: $sha."
          # Released commits are on main.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/${sha}...main" --jq '.status')"
          [ "$status" = ahead ] || [ "$status" = identical ] || fail "The commit $sha is not on main."

          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "sha7=${sha:0:7}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag ($sha)."

  # Runs the repository's code (checks, tests, the web build) with no secrets and no environment,
  # then hands the built app to the deploy job as an artifact.
  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magomap
          POSTGRES_PASSWORD: magomap
          POSTGRES_DB: magomap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magomap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://magomap:magomap@localhost:5432/magomap_test
    outputs:
      built_at: ${{ steps.web.outputs.built_at }}
    steps:
      # Pinned to the commit SHA of releases at least 14 days old.
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checks (the same commands as the gate and CI)
        run: bash scripts/checks.sh

      - name: Build the web app for this release
        id: web
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          built_at="$(bash scripts/deploy-release.sh build "$VERSION" "$SHA")"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"

      - name: Keep the built app for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # Holds the Cloudflare token. Runs no tests or web build: it installs only what Wrangler needs
  # (no install scripts), takes the app built above, and deploys it.
  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HEALTH_URL: https://magomap.jmn8718.workers.dev/api/health
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in the job that holds the Cloudflare token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Only the API and its workspace dependencies, and no install scripts, so no package code
      # runs here before the steps that hold the token (and nothing can rewrite GITHUB_ENV/PATH).
      - name: Install what Wrangler needs
        run: pnpm install --frozen-lockfile --filter "@magomap/api..." --ignore-scripts

      - name: Take the built app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist

      - name: Record a D1 Time Travel bookmark
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          info="$(pnpm exec wrangler d1 time-travel info magomap --env d1 --json)"
          bookmark="$(jq -er '.bookmark' <<< "$info")"
          {
            echo "## D1 bookmark before $TAG"
            echo
            echo "\`$bookmark\` (taken $(date -u +%FT%TZ), just before this run applied migrations; on a re-run after migrations already ran, the first attempt's bookmark is the pre-migration one)"
            echo
            echo "To restore: \`wrangler d1 time-travel restore magomap --env d1 --bookmark=$bookmark\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:d1 --remote

      - name: Deploy the Worker with the built app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          BUILT_AT: ${{ needs.build.outputs.built_at }}
        run: bash scripts/deploy-release.sh deploy "$VERSION" "$SHA" "$BUILT_AT"

      - name: Check the deployed version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA7: ${{ needs.resolve.outputs.sha7 }}
        run: |
          set -euo pipefail
          # A new deployment can take a few seconds to reach every location.
          health=''
          for attempt in 1 2 3 4 5 6; do
            health="$(curl -fsS --max-time 10 "$HEALTH_URL")" || health=''
            if [ "$(jq -r '.commit // empty' <<< "$health" 2>/dev/null)" = "$SHA7" ]; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          {
            echo "## Health after $TAG"
            echo
            echo '```json'
            # Compact JSON, so a stray fence in the body can't break the summary's formatting.
            jq -c . <<< "$health" 2>/dev/null || echo '(no response)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          commit="$(jq -r '.commit // empty' <<< "$health" 2>/dev/null || true)"
          if [ "$commit" != "$SHA7" ]; then
            echo "::error::$HEALTH_URL reports commit '${commit}', expected $SHA7."
            exit 1
          fi
          echo "$HEALTH_URL reports $SHA7."

  # An extension release (tag extension-vX.Y.Z) gets its zip attached, so the "Get the magomap
  # extension" link in Account always has a file. Built without secrets; uploaded by a job that
  # only runs `gh release upload`.
  extension-bundle:
    needs: release-please
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' && startsWith(needs.release-please.outputs.extension_tag_name, 'extension-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to the commit SHA of releases at least 14 days old.
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.extension_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the extension's dependencies
        run: pnpm install --frozen-lockfile --filter "@magomap/extension..."
      - name: Test and bundle the release build
        run: |
          set -euo pipefail
          pnpm --filter @magomap/extension test
          pnpm --filter @magomap/extension bundle
      - name: Keep the zip for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magomap-extension
          path: apps/extension/magomap-extension.zip
          if-no-files-found: error
          retention-days: 7

  # Immutable releases refuse new assets once published, so Release Please creates the extension
  # release as a draft (release-please-config.json); this job attaches the zip, then publishes it.
  extension-upload:
    needs: [release-please, extension-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Take the zip built above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magomap-extension
      - name: Attach it to the extension release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.extension_tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" magomap-extension.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
