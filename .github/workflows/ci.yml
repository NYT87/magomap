name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magomap
          POSTGRES_PASSWORD: magomap
          POSTGRES_DB: magomap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magomap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://magomap:magomap@localhost:5432/magomap_test
    steps:
      # Pinned to the commit SHA of releases at least 14 days old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Checks (the same commands as the gate)
        run: bash scripts/checks.sh
