name = "magomap"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Every environment declares all of its vars and bindings: Wrangler does not inherit them.
# Secrets (KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET, MAGOMAP_IMPORT_SECRET) go in .dev.vars
# locally and `wrangler secret put --env <env>` when deployed.

[env.d1]
assets = { directory = "../web/dist", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }
name = "magomap"
# Worker logs, kept by Cloudflare for 7 days (https://developers.cloudflare.com/workers/observability/logs/workers-logs/)
observability = { enabled = true }
# 60 searches per minute per user (https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/)
[[env.d1.ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Daily clean-up at 03:17 UTC: closes import runs abandoned for a week (src/scheduled.ts)
# https://developers.cloudflare.com/workers/configuration/cron-triggers/
[env.d1.triggers]
crons = ["17 3 * * *"]

[env.d1.vars]
DB_DRIVER = "d1"
KAKAO_REDIRECT_URI = "https://magomap.jmn8718.workers.dev/api/auth/kakao/callback"
KAKAO_JAVASCRIPT_KEY = "8b9138ecff36eeb1966216f7b8b1bd1a"
ALLOWED_KAKAO_USER_IDS = "4897793509,4891281929"
KAKAO_LIST_URL = "https://kakao-list-api.vercel.app"
ALLOW_DEV_LOGIN = "false"
ALLOW_DEV_UPLOAD = "false"
[[env.d1.d1_databases]]
binding = "DB"
database_name = "magomap"
database_id = "a4acc205-5c27-473e-844e-6dcf67aa70d4"
migrations_dir = "../../packages/db/migrations/sqlite"

[env.postgres]
assets = { directory = "../web/dist", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }
name = "magomap-postgres"
# Worker logs, kept by Cloudflare for 7 days (https://developers.cloudflare.com/workers/observability/logs/workers-logs/)
observability = { enabled = true }
# 60 searches per minute per user (https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/)
[[env.postgres.ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Daily clean-up at 03:17 UTC: closes import runs abandoned for a week (src/scheduled.ts)
# https://developers.cloudflare.com/workers/configuration/cron-triggers/
[env.postgres.triggers]
crons = ["17 3 * * *"]

[env.postgres.vars]
DB_DRIVER = "postgres"
KAKAO_REDIRECT_URI = "http://localhost:8787/api/auth/kakao/callback"
KAKAO_JAVASCRIPT_KEY = ""
ALLOWED_KAKAO_USER_IDS = ""
KAKAO_LIST_URL = "http://localhost:8788"
ALLOW_DEV_LOGIN = "false"
# Local dev only: uploads from Kakao Map are allowed with an empty allowlist. Never in d1.
ALLOW_DEV_UPLOAD = "true"
[[env.postgres.hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://magomap:magomap@localhost:5432/magomap_dev"
