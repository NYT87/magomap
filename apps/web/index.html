<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6F5C" />
    <script>
      // Applies a saved theme before first paint. The dark bar colour repeats DARK_BAR in
      // src/theme.ts, which is --dark-color-bg in src/styles/tokens.css: keep them in step.
      (() => {
        let t = null;
        try {
          t = localStorage.getItem("mm.theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#141816");
        } catch {
          // storage blocked: the device's setting applies
        }
      })();
    </script>
    <meta name="description" content="magomap — your own map of places and visits." />
    <!-- The Kakao map's script, its library and its tiles: connected while the app loads. -->
    <link rel="preconnect" href="https://dapi.kakao.com" />
    <link rel="preconnect" href="https://t1.kakaocdn.net" />
    <link rel="preconnect" href="https://mts.kakaocdn.net" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>magomap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
